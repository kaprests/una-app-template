# Dev environment for UNA Watch apps. See README.md.
# SDK docs: https://www.developers.unawatch.com/latest/sdk-setup.html

[vars]
app = ""   # set by `mise run new-app`

[tools]
uv = "latest"
cmake = "4.4"
# Arm GNU Toolchain (upstream of ST's "GNU Tools for STM32"; no ST account needed).
# SDK CI (una-sdk/.github/workflows/apps-ci.yml) builds in xanderhendriks/stm32cubeide:16.0,
# which is STM32CubeIDE 1.19.0 -> GNU Tools for STM32 13.3.rel1 (per ST release notes, unverified).
# Recheck apps-ci.yml when bumping the SDK tag below.
gcc-arm-none-eabi = "13.3.Rel1"

[env]
UNA_SDK = "{{config_root}}/una-sdk"
# Activate the uv-managed venv (uv owns Python + the venv; mise only puts it on PATH).
_.python.venv = { path = ".venv" }

# Host packages for the Linux (GCC + SDL2) simulator. Not needed for firmware builds.
[bootstrap.packages]
"pacman:base-devel" = "latest"
"pacman:git" = "latest"
"pacman:sdl2-compat" = "latest"
"pacman:sdl2_image" = "latest"
"pacman:libjpeg-turbo" = "latest"
"pacman:ruby" = "latest"
"pacman:ruby-nokogiri" = "latest"
"pacman:ruby-erb" = "latest"   # Arch splits erb out of ruby; TouchGFX textconvert needs it
"pacman:gdb" = "latest"
"apt:build-essential" = "latest"
"apt:git" = "latest"
"apt:libsdl2-dev" = "latest"
"apt:libsdl2-image-dev" = "latest"
"apt:libjpeg-dev" = "latest"
"apt:ruby" = "latest"
"apt:ruby-nokogiri" = "latest"
"apt:gdb" = "latest"

[bootstrap.repos]
"una-sdk" = { url = "https://github.com/UNAWatch/una-sdk.git", ref = "sdk-v1.5.0" }

# Runs last in `mise bootstrap`, after the SDK is cloned and tools are installed.
[tasks.bootstrap]
run = [
  "git -C una-sdk submodule update --init ThirdParty/lvgl",
  "uv sync",
]

# Docs: sdk-setup.html#building-apps-manually and Simulator.html#linux-gcc
[tasks.build]
description = "Build the .uapp"
dir = "Software/Apps/{{vars.app}}-CMake"
run = ['cmake -G "Unix Makefiles" -S . -B build', 'cmake --build build -j']

[tasks.sim-build]
description = "Build the Linux simulator"
dir = "Software/Apps/TouchGFX-GUI"
run = 'make -f simulator/gcc/Makefile -j"$(nproc)"'

[tasks.sim]
description = "Build and run the Linux simulator"
depends = ["sim-build"]
dir = "Software/Apps/TouchGFX-GUI"
run = "./build/bin/simulator.out"

[tasks.clean]
description = "Remove build output"
run = "rm -rf Software/Apps/{{vars.app}}-CMake/build Software/Apps/TouchGFX-GUI/build"
